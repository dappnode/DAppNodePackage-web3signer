name: "Main"
on:
  pull_request:
  push:
    branches:
      - "master"
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "README.md"

jobs:
  build-test:
    runs-on: ubuntu-latest
    name: Build test
    if: github.event_name != 'push'
    strategy:
      matrix:
        variant: [gnosis, lukso, mainnet, hoodi]
    steps:
      - uses: actions/checkout@v4
      - name: Build with variant ${{ matrix.variant }}
        run: npx @dappnode/dappnodesdk build --skip_save --variant ${{ matrix.variant }}
      
  e2e-test:
    runs-on: mainnet
    needs: build-test
    if: github.event_name != 'push'
    name: End to end tests
    steps:
      - uses: actions/checkout@v4
      - run: npx @dappnode/dappnodesdk@latest github-action test-end-to-end --errorLogsTimeout 120 --healthCheckUrl http://web3signer.web3signer.dappnode:9000 --network mainnet

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        variant: [gnosis, lukso, mainnet, hoodi]
    steps:
      - uses: actions/checkout@v4
      - name: Publish variant ${{ matrix.variant }}
        run: npx @dappnode/dappnodesdk publish patch --dappnode_team_preset --variant ${{ matrix.variant }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOPER_ADDRESS: "0xf35960302a07022aba880dffaec2fdd64d5bf1c1"
